appId: com.gmaildesktop.app
productName: Gmail Desktop
directories:
  output: dist
files:
  - dist-electron/**/*
  - renderer/out/**/*
  - assets/**/*
  - package.json
  - CHANGELOG.md
publish:
  provider: github
  # every installer bakes this owner into resources/app-update.yml, so a copy that is already
  # installed keeps asking the owner it was built with. Everything up to 0.3.1-beta.13 asks
  # lucamanuel-art/gmail-desktop and reaches this organisation through a single bridge release
  # published there, so that repository has to stay alive until nobody reports an older version
  owner: Abovomaxlead
  repo: gmail-desktop
  # a beta must not become the update everyone on the last stable version is offered:
  # GitHub keeps the newest full release as Latest and electron-updater follows that
  releaseType: prerelease
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.png
mac:
  # zip beside the dmg, and it is not optional: electron-updater's MacUpdater takes a zip and
  # explicitly refuses a dmg or a pkg, so a mac release without one throws
  # ERR_UPDATER_ZIP_FILE_NOT_FOUND on every check. Electron's own default here is
  # ["zip", "dmg"] and naming only the dmg is what dropped it. The dmg is what a person
  # installs; the zip is what the updater reads.
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: build/icon.png
