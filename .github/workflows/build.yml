name: Build (no publish)

# Manually-triggered Windows build that produces the installer as a downloadable
# artifact WITHOUT publishing a GitHub release — for test installs before a real
# release. Run it from the Actions tab (or `gh workflow run build.yml`).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      # Same as the release workflow: a test install has to be able to link accounts too,
      # or it is not testing the thing people will run. See release.yml for why this comes
      # from a secret rather than the repository.
      - name: Write the bundled OAuth config
        shell: bash
        run: printf '%s' "$GOOGLE_OAUTH_JSON" > assets/oauth-defaults.json
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}

      - name: Build installer (no publish)
        # electron-builder auto-publishes in CI when a publish config exists;
        # --publish never forces a build-only run (no GH_TOKEN, no release).
        run: npm run build && npx electron-builder --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmail-desktop-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
