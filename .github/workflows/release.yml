name: Release

# Build the Windows installer on a Windows runner and publish a GitHub release
# (installer + latest.yml for electron-updater) whenever a v* tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      # The OAuth config ships inside the app so a fresh machine can link accounts without
      # anyone copying a file into AppData first. It is not in the repository — that is
      # public, and a client secret in a public repository is found by credential scanners
      # and withdrawn — so it arrives here from a repository secret holding the whole
      # google-oauth.json, relayUrl and pushTopic included.
      #
      # Without the secret this writes an empty file and printf still succeeds, which used to
      # publish a release that could not link an account. The step after it is what refuses.
      - name: Write the bundled OAuth config
        shell: bash
        run: printf '%s' "$GOOGLE_OAUTH_JSON" > assets/oauth-defaults.json
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}

      # A release that ships no config cannot link accounts, and one that ships a different
      # OAuth client unlinks every account that is already linked. Neither may be published.
      - name: Check the bundled OAuth config
        run: npm run check:oauth

      # electron-builder would create the release itself, and `releaseType: prerelease` in
      # electron-builder.yml then marks every one of them as a pre-release. That is right for a
      # beta and wrong for a stable version: a repository whose newest release is a pre-release
      # has no /releases/latest at all, and an installation that never opted into prereleases
      # finds nothing there. So the release is created here with the flag the tag asks for --
      # electron-builder reuses a release it finds by tag and leaves that flag alone.
      #
      # Deleting first makes a re-run of a failed release idempotent: without it the leftover
      # release keeps the assets and the flag of the run that failed.
      - name: Create the release the tag asks for
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          # 1.0.0-beta.1 must never become the update everyone on 1.0.0 is offered
          case "$VER" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          node scripts/release-notes.mjs "$VER" > release-notes.md
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file release-notes.md $PRE
          rm -f release-notes.md

      - name: Build and publish release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
